name: quality

# Веднъж седмично: проверява инструментите срещу ground_truth.json и пуска примерните въпроси през агента.
# Нужен е secret OPENROUTER_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check tools against known answers
        run: uv run python -m imotko.quality.checks

      - name: Run agent evals
        if: ${{ !cancelled() }}
        run: uv run python evals/run_agent_evals.py
