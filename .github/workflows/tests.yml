# Тестовете при всеки push в main и при всеки pull request.
# Тестовете не ползват мрежа и ключове: всички заявки към imot.bg, картата и моделите са подменени.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # версията на Python е от .python-version, зависимостите - точно по uv.lock
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # само проверка, че образът се строи; не се публикува никъде
      - name: Build image
        run: docker build --tag imotko:ci .
